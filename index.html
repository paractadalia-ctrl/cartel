<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Defensas 25 de Mayo 2026 - Cartelería Digital</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
tailwind.config = { theme: { extend: { colors: { ruby: { 50:'#fff5f6',100:'#ffe3e6',200:'#ffc7cd',300:'#ff9ca6',400:'#ff5c6c',500:'#f0283d',600:'#dc1228',700:'#b30d20',800:'#8a0a19',900:'#5c0610' }, ink: '#2a0a0f' }, fontFamily: { sans: ['Outfit','ui-sans-serif','system-ui','sans-serif'] } } } };
</script>
<style>


/* ============================================================
   PALETA BLANCO + ROJO
   ============================================================ */

/* Ángulo animable para bordes cónicos */
@property --angle {
  syntax: '<angle>';
  initial-value: 0deg;
  inherits: false;
}

html, body, #root {
  min-height: 100%;
}

body {
  margin: 0;
  background: #ffffff;
  color: var(--color-ink);
  font-family: 'Outfit', ui-sans-serif, system-ui, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ============================================================
   FONDO: malla roja que se desplaza + auroras
   ============================================================ */
.bg-tech-grid {
  background-color: #ffffff;
  background-image:
    radial-gradient(1200px 700px at 8% -12%, rgba(255, 92, 108, 0.20), transparent 62%),
    radial-gradient(1000px 700px at 100% 112%, rgba(220, 18, 40, 0.16), transparent 62%),
    linear-gradient(to right, rgba(220, 18, 40, 0.07) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(220, 18, 40, 0.07) 1px, transparent 1px);
  background-size: auto, auto, 44px 44px, 44px 44px;
  background-position: 0 0, 0 0, 0 0, 0 0;
  animation: gridDrift 14s linear infinite;
}

@keyframes gridDrift {
  to { background-position: 0 0, 0 0, 44px 44px, 44px 44px; }
}

.blob {
  position: fixed;
  border-radius: 9999px;
  filter: blur(90px);
  pointer-events: none;
  will-change: transform;
}
.blob-a {
  top: -12%; left: -8%;
  width: 560px; height: 560px;
  background: rgba(255, 92, 108, 0.30);
  animation: blobA 16s ease-in-out infinite;
}
.blob-b {
  bottom: -14%; right: -8%;
  width: 640px; height: 640px;
  background: rgba(220, 18, 40, 0.22);
  animation: blobB 20s ease-in-out infinite;
}
.blob-c {
  top: 38%; left: 46%;
  width: 420px; height: 420px;
  background: rgba(255, 156, 166, 0.28);
  animation: blobC 18s ease-in-out infinite;
}

@keyframes blobA {
  0%, 100% { transform: translate(0, 0) scale(1); }
  33% { transform: translate(140px, 90px) scale(1.18); }
  66% { transform: translate(-50px, 160px) scale(0.92); }
}
@keyframes blobB {
  0%, 100% { transform: translate(0, 0) scale(1); }
  40% { transform: translate(-160px, -80px) scale(1.12); }
  70% { transform: translate(60px, -140px) scale(0.9); }
}
@keyframes blobC {
  0%, 100% { transform: translate(0, 0) scale(1); }
  50% { transform: translate(-200px, 60px) scale(1.25); }
}

/* Haz de luz diagonal que cruza la pantalla */
.beam {
  position: fixed;
  top: -20%;
  bottom: -20%;
  left: -30vw;
  width: 20vw;
  background: linear-gradient(100deg, transparent, rgba(255, 70, 90, 0.10), rgba(255, 255, 255, 0.55), transparent);
  pointer-events: none;
  animation: beam 10s ease-in-out infinite;
}
@keyframes beam {
  0% { transform: translateX(0) skewX(-18deg); }
  60%, 100% { transform: translateX(170vw) skewX(-18deg); }
}

/* Anillos giratorios decorativos */
.ring-spin { animation: rotateFull 40s linear infinite; }
.ring-spin-rev { animation: rotateFull 55s linear infinite reverse; }

@keyframes rotateFull {
  to { transform: rotate(360deg); }
}
.animate-rotate { animation: rotateFull 6s linear infinite; }

/* ============================================================
   TEXTO
   ============================================================ */
.text-shimmer-red {
  background-image: linear-gradient(
    100deg,
    #b30d20 0%,
    #ff4d5e 25%,
    #dc1228 50%,
    #ff7a86 75%,
    #b30d20 100%
  );
  background-size: 200% auto;
  color: transparent;
  -webkit-background-clip: text;
  background-clip: text;
  animation: shimmerFlow 5s linear infinite;
}
@keyframes shimmerFlow {
  to { background-position: -200% center; }
}

/* Dígito del reloj que "cae" al cambiar */
.animate-digit {
  display: inline-block;
  animation: digitPop 0.45s cubic-bezier(0.2, 0.9, 0.3, 1.2) both;
}
@keyframes digitPop {
  0% { transform: translateY(-60%) scale(0.8); opacity: 0; filter: blur(3px); }
  100% { transform: none; opacity: 1; filter: none; }
}

/* ============================================================
   EFECTOS DE TARJETA
   ============================================================ */
.shine { position: relative; overflow: hidden; }
.shine::after {
  content: '';
  position: absolute;
  top: 0;
  left: -70%;
  width: 40%;
  height: 100%;
  background: linear-gradient(100deg, transparent, rgba(255, 255, 255, 0.8), transparent);
  transform: skewX(-20deg);
  transition: left 0.9s ease;
  pointer-events: none;
  z-index: 3;
}
.shine:hover::after { left: 135%; }
.shine-loop::after { animation: shineLoop 5s ease-in-out infinite; }
@keyframes shineLoop {
  0%, 55% { left: -70%; }
  100% { left: 140%; }
}

/* Borde con luz giratoria */
.glow-border { position: relative; }
.glow-border::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 2px;
  background: conic-gradient(
    from var(--angle),
    rgba(255, 255, 255, 0) 0deg,
    #ff5c6c 70deg,
    #dc1228 140deg,
    rgba(255, 255, 255, 0) 210deg,
    rgba(255, 255, 255, 0) 360deg
  );
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0);
  animation: angleSpin 3.2s linear infinite;
  pointer-events: none;
  z-index: 4;
}
@keyframes angleSpin {
  to { --angle: 360deg; }
}

/* Aro cónico para el logo */
.conic-spin {
  background: conic-gradient(from var(--angle), #dc1228, #ffe3e6, #ff5c6c, #dc1228);
  animation: angleSpin 3s linear infinite;
}

/* Gradiente que fluye (botones, etiquetas) */
.bg-flow {
  background-size: 200% 100%;
  animation: gradientFlow 3.5s linear infinite;
}
@keyframes gradientFlow {
  to { background-position: 200% 50%; }
}

/* Respiración de brillo rojo */
.animate-breathe { animation: breathe 2.6s ease-in-out infinite; }
@keyframes breathe {
  0%, 100% { box-shadow: 0 0 0 0 rgba(220, 18, 40, 0.32), 0 14px 40px -14px rgba(220, 18, 40, 0.40); }
  50% { box-shadow: 0 0 0 10px rgba(220, 18, 40, 0), 0 20px 52px -10px rgba(220, 18, 40, 0.60); }
}

/* Flotación suave */
.animate-float { animation: floatY 3.2s ease-in-out infinite; }
@keyframes floatY {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

/* Flecha que invita a pulsar */
.animate-nudge { animation: nudgeX 1.2s ease-in-out infinite; }
@keyframes nudgeX {
  0%, 100% { transform: translateX(0); }
  50% { transform: translateX(4px); }
}

/* Radar rojo */
.animate-radar { animation: radarSweepRed 2.2s ease-out infinite; }
@keyframes radarSweepRed {
  0% { transform: scale(0.85); opacity: 0.85; }
  50% { opacity: 0.3; }
  100% { transform: scale(1.7); opacity: 0; }
}

/* ============================================================
   TICKER Y BARRA DE PROGRESO
   ============================================================ */
.animate-marquee {
  display: flex;
  width: max-content;
  animation: marquee 45s linear infinite;
}
.animate-marquee:hover { animation-play-state: paused; }
@keyframes marquee {
  0% { transform: translateX(0%); }
  100% { transform: translateX(-50%); }
}

.fade-x {
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 4%, #000 96%, transparent);
}

.progress-fill {
  background-image:
    repeating-linear-gradient(115deg, rgba(255, 255, 255, 0.30) 0 10px, transparent 10px 20px),
    linear-gradient(90deg, #ff5c6c, #dc1228, #b30d20);
  background-size: 28px 100%, 100% 100%;
  animation: stripes 0.9s linear infinite;
}
@keyframes stripes {
  to { background-position: 28px 0, 0 0; }
}

/* Línea de energía bajo el header y sobre el footer */
.energy-line {
  height: 2px;
  background: linear-gradient(90deg, transparent, #dc1228, #ff7a86, #dc1228, transparent);
  background-size: 200% 100%;
  animation: gradientFlow 3s linear infinite;
}

</style>
</head>
